services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sisepp_piloto}
      POSTGRES_USER: ${POSTGRES_USER:-sisepp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD en .env}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sisepp_user} -d ${POSTGRES_DB:-sisepp_piloto}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SISEPP_SERVER_PORT: 8081
      SISEPP_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-sisepp_piloto}
      SISEPP_DB_USER: ${POSTGRES_USER:-sisepp_user}
      SISEPP_DB_PASS: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD en .env}
      SISEPP_JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET en .env (min. 32 caracteres)}
      SPRING_PROFILES_ACTIVE: dev
      SISEPP_SEED_PASSWORD: ${SEED_PASSWORD:?defina SEED_PASSWORD en .env}
      SISEPP_MAIL_ENABLED: "false"
      SISEPP_CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-9090}
      SISEPP_FRONTEND_URL: http://localhost:${FRONTEND_PORT:-9090}
    ports:
      - "${BACKEND_PORT:-8081}:8081"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    network_mode: host
    environment:
      NGINX_PORT: ${FRONTEND_PORT:-9090}
      API_HOST: 127.0.0.1
      API_PORT: ${BACKEND_PORT:-8081}

volumes:
  pgdata:
