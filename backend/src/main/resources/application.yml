server:
  port: ${SISEPP_SERVER_PORT:8081}

spring:
  application:
    name: sisepp-backend
  datasource:
    url: ${SISEPP_DB_URL:jdbc:postgresql://localhost:5432/sisepp}
    username: ${SISEPP_DB_USER:sisepp_user}
    password: ${SISEPP_DB_PASS}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  mail:
    host: ${SISEPP_MAIL_HOST:smtp.gmail.com}
    port: ${SISEPP_MAIL_PORT:587}
    username: ${SISEPP_MAIL_USERNAME:}
    password: ${SISEPP_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  flyway:
    enabled: true
    locations: classpath:db/migration

sisepp:
  security:
    # Obligatorio, sin valor por defecto: la app no arranca si falta (ver JwtService).
    jwt-secret: ${SISEPP_JWT_SECRET}
    jwt-expiration-minutes: ${SISEPP_JWT_EXPIRATION:480}
  login:
    max-failed-attempts: 5
    lock-minutes: 15
  password-reset:
    token-expiration-minutes: 30
  cors:
    allowed-origins: ${SISEPP_CORS_ORIGINS:http://localhost:5173}
  frontend:
    base-url: ${SISEPP_FRONTEND_URL:http://localhost:5173}
  mail:
    enabled: ${SISEPP_MAIL_ENABLED:false}
    from: ${SISEPP_MAIL_FROM:noreply@example.com}
    from-name: ${SISEPP_MAIL_FROM_NAME:SISEPP Demo}
