# Configuración de las pruebas de integración.
# El datasource no se define aquí: lo inyecta Testcontainers mediante
# @ServiceConnection, apuntando al contenedor de PostgreSQL de cada corrida.

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed-dev
    placeholders:
      # Contrasena aleatoria por corrida: las pruebas no inician sesion con ella.
      seed_password: ${random.uuid}

sisepp:
  security:
    # Solo para pruebas. El secreto real se externaliza por variable de entorno.
    jwt-secret: "SECRETO_DE_PRUEBAS_CON_AL_MENOS_32_CARACTERES_PARA_HS256"
    jwt-expiration-minutes: 60
  login:
    max-failed-attempts: 5
    lock-minutes: 15
  password-reset:
    token-expiration-minutes: 30

logging:
  level:
    org.hibernate.SQL: warn
    org.testcontainers: warn
    com.github.dockerjava: warn
